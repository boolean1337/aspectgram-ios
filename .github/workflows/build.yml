name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /Applications/Android*.app || true
          sudo rm -rf /Applications/Xcode_1*.app || true
          sudo rm -rf /Applications/Xcode_2[0-4]*.app || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /Users/runner/Library/Android || true
          sudo rm -rf /Users/runner/.gradle || true
          df -h /

      - name: Set active Xcode path
        run: |
          set -x
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            # fall back to the newest installed Xcode
            XCODE_PATH=$(ls -dt /Applications/Xcode*.app | head -1)
          fi
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          rm -rf /Users/Shared/telegram-ios
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          # Fake provisioning profiles carry a CMS signature that breaks as soon as
          # their ExpirationDate is patched, and BuildConfiguration.py verifies it.
          # Extract the payload, bump the date, and re-sign with a throwaway key.
          python3 - <<'PY'
          import glob
          for path in glob.glob('build-system/fake-codesigning/profiles/*.mobileprovision'):
              data = open(path, 'rb').read().replace(b'2026-10-30T17:06:30Z', b'2030-10-30T17:06:30Z')
              # Match the app's custom bundle id (appstore-configuration.json)
              data = data.replace(b'ph.telegra.Telegraph', b'com.aspectgram.app')
              start = data.find(b'<?xml')
              end = data.find(b'</plist>')
              if start < 0 or end < 0:
                  raise SystemExit('no plist payload in ' + path)
              open(path + '.payload', 'wb').write(data[start:end + len(b'</plist>')])
          PY
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout /tmp/fake-codesigning.key -out /tmp/fake-codesigning.crt \
            -subj "/CN=Fake Codesigning" 2>/dev/null
          for p in build-system/fake-codesigning/profiles/*.mobileprovision; do
            openssl smime -sign -in "$p.payload" -outform der -nodetach \
              -signer /tmp/fake-codesigning.crt -inkey /tmp/fake-codesigning.key -out "$p"
            rm -f "$p.payload"
            openssl smime -verify -noverify -inform der -in "$p" > /dev/null
          done

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts

          # Make.py itself copies Telegram.ipa and Telegram.DSYMs.zip into build/artifacts
          ls -la build/artifacts

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-DSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn
